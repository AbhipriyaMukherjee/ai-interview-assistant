<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CareerAI | Interview Coach</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-green: #0a2e2a; 
            --baby-blue: #a2d2ff;
            --white: #ffffff;
        }
        body { font-family: 'Inter', sans-serif; background: #f0f9ff; margin: 0; color: var(--dark-green); }
        nav { background: var(--dark-green); padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid var(--baby-blue); }
        .logo { color: var(--baby-blue); font-weight: 900; font-size: 1.8rem; text-decoration: none; }
        .container { max-width: 1100px; margin: 3rem auto; padding: 0 20px; }
        .glass-card { background: var(--white); padding: 3rem; border-radius: 25px; box-shadow: 0 15px 35px rgba(10,46,42,0.1); border: 2px solid var(--baby-blue); }
        
        /* High Visibility Inputs */
        label { display: block; font-weight: 900; color: var(--dark-green); margin-bottom: 12px; font-size: 1.2rem; text-transform: uppercase; }
        input { width: 100%; padding: 18px; border: 2px solid #cbd5e1; border-radius: 15px; font-weight: 700; box-sizing: border-box; color: var(--dark-green); font-size: 1rem; margin-bottom: 1.5rem; }
        input:focus { border-color: var(--dark-green); outline: none; background: #f8fafc; }
        
        .btn-primary { background: var(--dark-green); color: var(--baby-blue); padding: 15px 35px; border: 2px solid var(--baby-blue); border-radius: 50px; font-weight: 900; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-primary:hover { background: var(--baby-blue); color: var(--dark-green); transform: translateY(-2px); }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo"><i class="fa fa-robot"></i> CareerAI</a>
        <div>
            {% if current_user.is_authenticated %}
                <a href="/resume" style="color: white; text-decoration: none; margin-right: 25px; font-weight: 900; font-size: 0.9rem;">RE-ANALYZE RESUME</a>
                <a href="/logout" class="btn-primary" style="padding: 10px 25px;">LOGOUT</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
