{% extends "layout.html" %}
{% block content %}
<div style="display: flex; justify-content: center;">
    <div class="glass-card" style="max-width: 600px; text-align: center;">
        <i class="fa fa-file-invoice" style="font-size: 4rem; color: var(--dark-green); margin-bottom: 1.5rem;"></i>
        <h1 style="font-weight: 900; text-transform: uppercase;">Analyze Resume</h1>
        <p style="font-weight: 700; color: #64748b; margin-bottom: 2rem;">Upload your PDF to detect skills and get role recommendations.</p>
        <form action="/resume" method="POST" enctype="multipart/form-data">
            <div style="margin: 2rem 0; text-align: left;">
                <label>Select PDF Document</label>
                <input type="file" name="resume" accept=".pdf" required style="padding: 30px; border: 3px dashed var(--baby-blue); background: #f8fafc; border-radius: 15px;">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; font-size: 1.2rem;">ANALYZE MY SKILLS</button>
        </form>
    </div>
</div>
{% endblock %}
